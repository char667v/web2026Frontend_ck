<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr.Duck | Product Card</title>
    <script src="dist/zalando.js" defer></script>
    <link rel="stylesheet" href="style2.css" />
</head>

<body>
    <!-- ovelse components templates  -->
    <div id="productContainer">
        <template id="productTemplate">
            <article class="product-card">
                <div class="image-wrapper">
                    <button class="favorite-btn" aria-label="Add to wishlist">
                        <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                        </svg>
                    </button>
                    <img src="" alt="" class="product-image">
                </div>
                <div class="product-info">
                    <h2 class="brand"></h2>
                    <p class="product-name"></p>
                    <p class="price"></p>
                    <div class="btn-row">
                        <button class="add-to-cart-btn">Add to cart
                            <img src="/src/icons/shopping-cart-white-icon.svg" alt="" width="18" height="18">
                        </button>
                        <button class="arrow-btn">→</button>
                    </div>
                </div>
            </article>
        </template>
    </div>
</body>

</html>
